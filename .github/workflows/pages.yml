name: Publish Pages

on:
  workflow_run:
    workflows: [Verify]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Enable pnpm
        run: corepack enable
      - name: Resolve locked dependencies
        run: |
          pnpm install --frozen-lockfile
          flutter pub get --enforce-lockfile
      - name: Build tutorial site
        run: pnpm docs:build
      - name: Build independent Flutter previews
        env:
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}
        run: pnpm release:build:all
      - name: Assemble and smoke-test Pages artifact
        env:
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pnpm release:stage
          pnpm release:smoke
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: build/pages-staging
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
