name: city_event_radar
description: 统筹网络、缓存、偏好、搜索竞态与 Drift 收藏的 Flutter Web 项目。
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'

resolution: workspace

dependencies:
  cupertino_icons: 1.0.9
  drift: 2.34.3
  drift_flutter: 0.3.1
  flutter:
    sdk: flutter
  http: 1.6.0
  json_annotation: 4.12.0
  shared_preferences: 2.5.5

dev_dependencies:
  build_runner: 2.16.0
  drift_dev: 2.34.3
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0
  json_serializable: 6.14.1
  sqlite3: 3.4.0

flutter:
  uses-material-design: true
