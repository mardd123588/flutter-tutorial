dev_dependencies:
  build_runner: 2.16.0
  drift_dev: 2.34.3
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  riverpod_generator: 4.0.8
  sqlite3: 3.4.0

flutter:
  uses-material-design: true
